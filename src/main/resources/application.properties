spring.config.import=optional:file:.env[.properties]
spring.application.name=user-service
server.port=${PORT:8081}
server.address=0.0.0.0
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost

# ===============================
# = DATA SOURCE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# = HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool

spring.jpa.hibernate.ddl-auto=${JPA_HBM2DDL:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Shared service-to-service key for internal APIs. Configure the same value in mail-service.
user-service.api-key=${USER_SERVICE_API_KEY:}

# Frontend callback that receives the OAuth token in the URL fragment.
app.frontend.oauth-callback-url=${FRONTEND_OAUTH_CALLBACK_URL:http://localhost:5173/auth/callback}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,https://mail-desk-three.vercel.app}

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

#log
logging.level.org.springframework.security=DEBUG
logging.level.com.example.userservice=DEBUG